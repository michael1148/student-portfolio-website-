<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me | Student Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Get In Touch</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Me</a>
            <a href="projects.html">Projects</a>
            <a href="planner.html">Academic Planner</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main class="contact-container">

        <section class="contact-intro">
            <h2>Let's Connect</h2>

            <p>
                Have a question, an idea, or an opportunity?
                I'd love to hear from you. Fill out the form below
                and send me a message.
            </p>
        </section>

        <section class="contact-form-section">

            <h2>Send Me a Message</h2>

            <form id="contactForm" novalidate>

                <div class="form-group">
                    <label for="contactName">Full Name</label>
                    <input
                        type="text"
                        id="contactName"
                        placeholder="Enter your full name"
                        required
                    ><small class="error-message" id="nameError"></small>

                </div>

               <div class="form-group">
    <label for="contactEmail">Email Address</label>
    <input
        type="email"
        id="contactEmail"
        placeholder="example@email.com"
    >
    <small class="error-message" id="emailError"></small>
</div>

                <div class="form-group">
                    <label for="contactPhone">Phone Number</label>
                    <input
                        type="tel"
                        id="contactPhone"
                        placeholder="Enter digits only"
                        required
                    ><small class="error-message" id="phoneError"></small>

                </div>

                <div class="form-group">
                    <label for="contactMessage">Your Message</label>
                    <textarea
                        id="contactMessage"
                        rows="6"
                        placeholder="Write your message here..."
                        required
                       ></textarea><small class="error-message" id="messageError"></small>
                    </textarea>
                </div>

                <button type="submit" class="primary-button">
                    Send Message
                    <p id="formSuccess"></p>
                </button>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Student Portfolio. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
